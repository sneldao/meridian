<!-- close-callout: rev6 fork of mk-callout-highlight — the tagline sweeps in
     and lands on "ahead" (the noun that IS the product promise). -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #mk-ch-root { position: relative; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent; }
      #mk-ch-box { position: absolute; font-family: Georgia, "Times New Roman", serif;
        font-weight: 400; letter-spacing: -.01em; }
      .mk-ch-word { display: inline-block; }
      .mk-ch-word.punch { font-style: normal; }
    </style>
  </head>
  <body>
    <div id="mk-ch-root" data-composition-id="close-callout"
      data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="mk-ch-box" data-layout-allow-occlusion></div>
      <div class="clip" data-start="0" data-duration="10" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var CONFIG = {
          text: "agents that fly ahead of you",
          fontSize: 84, lineHeight: 1.15, maxWidth: 1400,
          x: null, y: 470, align: "center", punchIndex: 3,
        };
        var DUR = 10;
        var box = document.getElementById("mk-ch-box");
        var INK = "#1e1b18", FAINT = "#cfc5b6", PUNCH = "#D96B43";

        box.style.fontSize = CONFIG.fontSize + "px";
        box.style.lineHeight = String(CONFIG.lineHeight);
        box.style.maxWidth = CONFIG.maxWidth + "px";
        box.style.textAlign = CONFIG.align;

        var wordEls = [];
        CONFIG.text.split(/\s+/).forEach(function (w, i) {
          if (i > 0) box.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.className = "mk-ch-word" + (i === CONFIG.punchIndex ? " punch" : "");
          span.textContent = w;
          span.style.color = FAINT;
          box.appendChild(span);
          wordEls.push(span);
        });

        var rect = box.getBoundingClientRect();
        box.style.left = (CONFIG.x === null
          ? Math.round((1920 - rect.width) / 2) : CONFIG.x) + "px";
        box.style.top = (CONFIG.y === null
          ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

        var st = { p: 0 };
        var mixInk = gsap.utils.interpolate(FAINT, INK);
        var mixPunch = gsap.utils.interpolate(FAINT, PUNCH);
        var punch = wordEls[CONFIG.punchIndex];
        function render() {
          var k = st.p * wordEls.length;
          for (var i = 0; i < wordEls.length; i++) {
            var f = Math.max(0, Math.min(1, k - i));
            wordEls[i].style.color =
              i === CONFIG.punchIndex ? mixPunch(f) : mixInk(f);
          }
        }

        var tl = gsap.timeline({ paused: true });
        gsap.set(box, { opacity: 0, y: 30 });
        tl.to(box, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.6);
        tl.to(st, { p: 0.62, duration: 1.1, ease: "power1.inOut" }, 1.2);
        tl.to(st, { p: 1.05, duration: 0.55, ease: "power2.out" }, 2.5);
        tl.to(st, { p: 1.0, duration: 0.35, ease: "power2.inOut" }, 3.05);
        tl.fromTo(punch, { scale: 1 }, { scale: 1.14, duration: 0.32,
          yoyo: true, repeat: 1, ease: "power2.inOut" }, 2.7);
        tl.to(punch, { scale: 1.04, duration: 0.3, ease: "power1.out" }, 3.35);
        tl.eventCallback("onUpdate", render);
        render();
        window.__timelines["close-callout"] = tl;
      })();
    </script>
  </body>
</html>
