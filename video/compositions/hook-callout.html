<!-- hook-callout: rev6 fork of mk-callout-highlight for the hook line
     "Your body thinks it's 1 a.m." — the word sweep lands on "1 a.m." -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #mk-ch-root {
        --mk-ink: #ffc46b;
        --mk-ink-faint: rgba(255,196,107,0.28);
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        background: transparent;
      }
      #mk-ch-box {
        position: absolute;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400; letter-spacing: -.01em;
      }
      .mk-ch-word { display: inline; }
    </style>
  </head>
  <body>
    <div id="mk-ch-root" data-composition-id="hook-callout"
      data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="mk-ch-box" data-layout-allow-occlusion></div>
      <div id="mk-ch-drv" class="clip" data-start="0" data-duration="8"
        data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        // rev6 — the callout replaces the h3 hookline: it enters where h3
        // used to (internal ~5.9, after h1/h2 demote) and sweeps the colour
        // across the words so "1 a.m." lands last with an overshoot pulse.
        var CONFIG = {
          text: "Your body thinks it's 1 a.m.",
          fontSize: 96,
          lineHeight: 1.15,
          maxWidth: 740,
          x: 96,
          y: 618,
          align: "left",
          animationIn: true,
          animationOut: false, // exits handled by scene boundary
        };

        var DUR = 8;
        var root = document.getElementById("mk-ch-root");
        var box = document.getElementById("mk-ch-box");
        var FULL = CONFIG.scheme === "dark" ? "#f5f5f7" : CONFIG.ink || "#ffc46b";
        var FAINT = "#3a3530"; // dim until swept

        box.style.fontSize = CONFIG.fontSize + "px";
        box.style.lineHeight = String(CONFIG.lineHeight);
        box.style.maxWidth = CONFIG.maxWidth + "px";
        box.style.textAlign = CONFIG.align;

        var wordEls = [];
        CONFIG.text.split(/\s+/).forEach(function (w, i) {
          if (i > 0) box.appendChild(document.createTextNode(" "));
          var span = document.createElement("span");
          span.id = "mk-ch-w-" + i;
          span.className = "mk-ch-word";
          span.textContent = w;
          span.style.color = FAINT;
          box.appendChild(span);
          wordEls.push(span);
        });

        var rect = box.getBoundingClientRect();
        box.style.left =
          (CONFIG.x === null ? Math.round((1920 - rect.width) / 2) : CONFIG.x) + "px";
        box.style.top =
          (CONFIG.y === null ? Math.round((1080 - rect.height) / 2) : CONFIG.y) + "px";

        var st = { p: 0 };
        var mix = gsap.utils.interpolate(FAINT, FULL);
        function render() {
          var k = st.p * wordEls.length;
          for (var i = 0; i < wordEls.length; i++) {
            var f = Math.max(0, Math.min(1, k - i));
            wordEls[i].style.color = mix(f);
          }
        }

        var tl = gsap.timeline({ paused: true });

        if (CONFIG.animationIn) {
          gsap.set(box, { opacity: 0, y: 24 });
          tl.to(box, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 5.9);
        }

        // The keyframe-style sweep — context words light fast, then an
        // overshoot-and-settle on the punch phrase "1 a.m." (word idx 4–5).
        tl.to(st, { p: 0.7, duration: 0.7, ease: "power1.inOut" }, 6.3);
        tl.to(st, { p: 1.06, duration: 0.5, ease: "power2.out" }, 7.15);
        tl.to(st, { p: 1.0, duration: 0.35, ease: "power2.inOut" }, 7.6);

        tl.eventCallback("onUpdate", render);
        render();

        window.__timelines["hook-callout"] = tl;
      })();
    </script>
  </body>
</html>
