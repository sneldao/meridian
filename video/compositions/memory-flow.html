<!-- memory-flow: rev6 fork in the flowchart vocabulary — the hop path as a
     real diagram on the night grid: skip → record → adherence → next trip.
     Dark nodes, amber connectors, cursor visits each node in sequence. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; }
      #mf-root { position: relative; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mf-node { position: absolute; transform: translate(-50%,-50%) scale(0);
        padding: 20px 30px; border-radius: 14px; background: #10141d;
        border: 1px solid #2a2f3c; box-shadow: 0 20px 60px rgba(0,0,0,.5);
        white-space: nowrap; text-align: center; z-index: 10; }
      .mf-node .t { font-weight: 700; font-size: 30px; color: #f6f2ec;
        letter-spacing: -.01em; }
      .mf-node .s { margin-top: 6px; font-family: ui-monospace, Menlo, monospace;
        font-size: 15px; color: #9aa3b5; }
      .mf-node.mid { border-color: rgba(255,196,107,.5);
        box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(255,196,107,.08); }
      .mf-cx { fill: none; stroke-width: 2.5; stroke: #ffc46b;
        stroke-dasharray: 800; stroke-dashoffset: 800; opacity: .75; }
      .mf-cx-label { position: absolute; transform: translate(-50%,-50%);
        font-family: ui-monospace, Menlo, monospace; font-size: 13px;
        font-weight: 700; letter-spacing: .1em; color: #ffd98a;
        background: #0b0d12; padding: 4px 10px; border-radius: 5px;
        opacity: 0; z-index: 6; }
      .mf-cur { position: absolute; z-index: 100; pointer-events: none;
        opacity: 0; }
      .mf-cur .dot { width: 18px; height: 18px; border-radius: 50%;
        background: #ffc46b; box-shadow: 0 0 0 6px rgba(255,196,107,.2); }
      .mf-ring { position: absolute; transform: translate(-50%,-50%);
        border: 1.5px solid rgba(255,196,107,.7); border-radius: 16px;
        opacity: 0; pointer-events: none; z-index: 9; }
    </style>
  </head>
  <body>
    <div id="mf-root" data-composition-id="memory-flow"
      data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <svg width="1920" height="1080" viewBox="0 0 1920 1080"
        style="position:absolute;inset:0;z-index:5;pointer-events:none">
        <path id="mf-c1" class="mf-cx" d="M 580 500 Q 700 440 780 520"/>
        <path id="mf-c2" class="mf-cx" d="M 1140 520 Q 1260 460 1340 500"/>
      </svg>
      <div id="mf-l1" class="mf-cx-label" style="left:680px;top:440px">write</div>
      <div id="mf-l2" class="mf-cx-label" style="left:1240px;top:440px">read</div>

      <div class="mf-node" id="mf-n1" style="left:430px;top:540px">
        <div class="t">skipped 05:30 light</div>
        <div class="s">check-in · day 2 · last trip</div>
      </div>
      <div class="mf-node mid" id="mf-n2" style="left:960px;top:560px">
        <div class="t">adherence profile</div>
        <div class="s">per traveller · meridian:{tid}</div>
      </div>
      <div class="mf-node" id="mf-n3" style="left:1490px;top:540px">
        <div class="t">next trip starts 07:00</div>
        <div class="s">the second run differs</div>
      </div>
      <div class="mf-ring" id="mf-ring" style="left:960px;top:560px;
        width:460px;height:130px"></div>
      <div class="mf-cur" id="mf-cur" style="left:430px;top:460px">
        <div class="dot"></div>
      </div>
      <div class="clip" data-start="0" data-duration="16" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var S = "#mf-root";

        tl.to(S + " #mf-n1", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 1.0)
          .to(S + " #mf-c1", { strokeDashoffset: 0, duration: .7, ease: "none" }, 1.9)
          .to(S + " #mf-l1", { opacity: 1, duration: .2 }, 2.2)
          .to(S + " #mf-n2", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 2.7)
          .to(S + " #mf-c2", { strokeDashoffset: 0, duration: .7, ease: "none" }, 4.0)
          .to(S + " #mf-l2", { opacity: 1, duration: .2 }, 4.3)
          .to(S + " #mf-n3", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 4.9)
          // ring pulse around the graph node — the read lands
          .to(S + " #mf-ring", { opacity: 1, scale: 1.06, duration: .5,
            ease: "power2.out" }, 5.6)
          .to(S + " #mf-ring", { opacity: 0, scale: 1.18, duration: .8,
            ease: "power2.out" }, 6.1)
          // cursor visits each node — the hop path is traveled, not told
          .set(S + " #mf-cur", { opacity: 1 }, 1.2)
          .to(S + " #mf-cur", { x: 530, y: 60, duration: 1.2, ease: "power1.inOut" }, 2.7)
          .to(S + " #mf-cur", { x: 1060, y: 40, duration: 1.2, ease: "power1.inOut" }, 4.9)
          .to(S + " #mf-cur", { opacity: 0, duration: .3 }, 6.8)
          // ambient — the graph idles through the hold
          .to(S + " .mf-node", { y: "-=4", duration: 2.8, yoyo: true, repeat: 3,
            stagger: .35, ease: "sine.inOut" }, 8.5);

        window.__timelines["memory-flow"] = tl;
      })();
    </script>
  </body>
</html>
