<!-- gate-flow: rev6 fork in the `flowchart` vocabulary — the gate beat drawn
     as a real decision diagram on Meridian paper. draft → gate ✗ → revise →
     gate ✓ → locked, with the scorer's score flipping mid-scene. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden;
        background: transparent; }
      #gf-root { position: relative; width: 1920px; height: 1080px;
        overflow: hidden; background: transparent;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .gf-node { position: absolute; transform: translate(-50%,-50%) scale(0);
        padding: 22px 34px; border-radius: 16px; background: #fdf8f0;
        border: 1px solid #e3d5c3; box-shadow: 0 18px 50px rgba(30,27,24,.14);
        white-space: nowrap; text-align: center; z-index: 10; }
      .gf-node .t { font-weight: 800; font-size: 34px; color: #1e1b18;
        letter-spacing: -.01em; }
      .gf-node .s { margin-top: 6px; font-family: ui-monospace, Menlo, monospace;
        font-size: 16px; color: #5b4d41; }
      .gf-node.gate { border-left: 5px solid #D96B43; }
      .gf-node.lock { border-left: 5px solid #4a7c59; }
      .gf-node.revise { border-left: 5px solid #b04523; }
      .gf-score { display: inline-block; margin-top: 10px; padding: 8px 20px;
        border-radius: 99px; font-family: ui-monospace, Menlo, monospace;
        font-size: 22px; font-weight: 800; }
      .gf-score.fail { background: rgba(176,69,35,.12); color: #b04523;
        border: 1px solid rgba(176,69,35,.45); }
      .gf-score.pass { background: rgba(74,124,89,.14); color: #2f7a4f;
        border: 1px solid rgba(74,124,89,.5); }
      .gf-cx { fill: none; stroke-width: 3; }
      .gf-cx.draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; }
      .gf-cx-label { position: absolute; transform: translate(-50%,-50%);
        font-family: ui-monospace, Menlo, monospace; font-size: 14px;
        font-weight: 700; letter-spacing: .08em; padding: 4px 10px;
        border-radius: 6px; opacity: 0; z-index: 6; }
      .gf-cur { position: absolute; z-index: 100; pointer-events: none;
        opacity: 0; }
      .gf-cur .dot { width: 20px; height: 20px; border-radius: 50%;
        background: #D96B43; box-shadow: 0 0 0 6px rgba(217,107,67,.22); }
      .gf-cite { position: absolute; transform: translateX(-50%);
        font-family: ui-monospace, Menlo, monospace; font-size: 16px;
        color: #a8442a; opacity: 0; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="gf-root" data-composition-id="gate-flow"
      data-start="0" data-duration="16" data-width="1920" data-height="1080">
      <svg width="1920" height="1080" viewBox="0 0 1920 1080"
        style="position:absolute;inset:0;z-index:5;pointer-events:none">
        <path id="gf-c1" class="gf-cx draw" d="M 640 420 L 780 420" stroke="#a8442a"/>
        <path id="gf-c2" class="gf-cx draw" d="M 960 480 L 960 560 L 960 640" stroke="#b04523"/>
        <path id="gf-c3" class="gf-cx draw" d="M 1180 640 L 1240 640 L 1240 500 L 1180 500"
          stroke="#D96B43"/>
        <path id="gf-c4" class="gf-cx draw" d="M 1180 420 L 1340 420" stroke="#4a7c59"/>
      </svg>
      <div id="gf-l1" class="gf-cx-label" style="left:710px;top:392px;
        background:#f5efe6;color:#a8442a">score</div>
      <div id="gf-l2" class="gf-cx-label" style="left:960px;top:560px;
        background:#f5efe6;color:#b04523">reject · MISSING_LIGHT</div>
      <div id="gf-l3" class="gf-cx-label" style="left:1240px;top:560px;
        background:#f5efe6;color:#D96B43">re-score</div>
      <div id="gf-l4" class="gf-cx-label" style="left:1260px;top:392px;
        background:#f5efe6;color:#2f7a4f">pass</div>

      <div class="gf-node" id="gf-draft" style="left:520px;top:420px">
        <div class="t">draft</div>
        <div class="s">D-2 · 4 asks placed</div>
      </div>
      <div class="gf-node gate" id="gf-gate" style="left:960px;top:420px">
        <div class="t">gate</div>
        <div class="s">phase-response · deterministic</div>
        <div><span class="gf-score fail" id="gf-score">0.62 · ✗</span></div>
      </div>
      <div class="gf-node revise" id="gf-revise" style="left:960px;top:640px">
        <div class="t">revise</div>
        <div class="s">+ evening light anchor</div>
      </div>
      <div class="gf-node lock" id="gf-lock" style="left:1480px;top:420px">
        <div class="t">locked</div>
        <div class="s">meridian:{tid} · graph</div>
      </div>
      <div class="gf-cite" id="gf-cite" style="left:960px;top:760px">
        doi:10.1093/sleep/27.3.407 · hop 2 · traveller-scoped
      </div>
      <div class="gf-cur" id="gf-cur" style="left:520px;top:340px">
        <div class="dot"></div>
      </div>
      <div class="clip" data-start="0" data-duration="16" data-track-index="0"
        style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var S = "#gf-root";

        // score badge flips via a setter driver — deterministic on seek
        var scoreEl = document.getElementById("gf-score");
        var drv = {}, cur = 0;
        Object.defineProperty(drv, "v", {
          get: function () { return cur; },
          set: function (v) {
            cur = v;
            if (v >= 0.91) {
              scoreEl.textContent = "0.91 · ✓";
              scoreEl.className = "gf-score pass";
            } else {
              scoreEl.textContent = "0.62 · ✗";
              scoreEl.className = "gf-score fail";
            }
          }
        });

        // draft pops, connector draws, gate lands with the failing score
        tl.to(S + " #gf-draft", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 0.6)
          .to(S + " #gf-c1", { strokeDashoffset: 0, duration: .5, ease: "none" }, 1.5)
          .to(S + " #gf-l1", { opacity: 1, duration: .2 }, 1.7)
          .to(S + " #gf-gate", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 2.1)
          // reject path — red connector drops to revise
          .to(S + " #gf-c2", { strokeDashoffset: 0, duration: .5, ease: "none" }, 3.2)
          .to(S + " #gf-l2", { opacity: 1, duration: .2 }, 3.4)
          .to(S + " #gf-revise", { scale: 1, duration: .45, ease: "back.out(1.7)" }, 3.9)
          // re-score loop back up to the gate
          .to(S + " #gf-c3", { strokeDashoffset: 0, duration: .5, ease: "none" }, 4.8)
          .to(S + " #gf-l3", { opacity: 1, duration: .2 }, 5.1)
          // score flips — the gate passes
          .to(drv, { v: 0.91, duration: .01, ease: "none" }, 5.6)
          .to(S + " #gf-score", { scale: 1.18, duration: .18, yoyo: true, repeat: 1,
            ease: "power2.out" }, 5.6)
          .to(S + " #gf-c4", { strokeDashoffset: 0, duration: .5, ease: "none" }, 6.2)
          .to(S + " #gf-l4", { opacity: 1, duration: .2 }, 6.4)
          .to(S + " #gf-lock", { scale: 1, duration: .55, ease: "elastic.out(1,.55)" }, 6.9)
          .to(S + " #gf-cite", { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 7.6)
          // cursor travels the decided path — deterministic visit sequence
          .set(S + " #gf-cur", { opacity: 1 }, 1.0)
          .to(S + " #gf-cur", { x: 440, duration: .9, ease: "power1.inOut" }, 1.5)
          .to(S + " #gf-cur", { y: 300, duration: .7, ease: "power1.inOut" }, 3.2)
          .to(S + " #gf-cur", { y: 0, duration: .9, ease: "power1.inOut" }, 4.8)
          .to(S + " #gf-cur", { x: 960, duration: 1.0, ease: "power1.inOut" }, 6.9)
          .to(S + " #gf-cur", { opacity: 0, duration: .3 }, 8.4)
          // ambient — relative float preserves the translate(-50%) centering
          .to(S + " .gf-node", { y: "-=4", duration: 2.6, yoyo: true, repeat: 3,
            stagger: .3, ease: "sine.inOut" }, 9.5);

        window.__timelines["gate-flow"] = tl;
      })();
    </script>
  </body>
</html>
