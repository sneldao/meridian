name: Update visual baselines

# Visual baselines are platform-specific: they are generated and compared on
# the CI runner only, never on laptops. Regenerate them by dispatching this
# workflow with update_baselines=true, review the committed screenshots, and
# keep the push if they look right.

on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate all visual baselines and commit them"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Build
        run: bun run build
      - name: Regenerate baselines
        if: inputs.update_baselines == true
        run: bunx playwright test --update-snapshots
      - name: Commit baselines back
        if: inputs.update_baselines == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visual/meridian.spec.ts-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh visual baselines"
            git push
          fi
      - name: Report
        if: inputs.update_baselines != true
        run: echo "Dispatch with update_baselines=true to regenerate."
