name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      # No services and no API keys: FALKORDB_URL unset is a supported state
      # (tests/graph-memory.test.ts guards the offline path) and the provider
      # tests stub fetch.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test
