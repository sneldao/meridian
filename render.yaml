services:
  # Public demo surface: the free tier. Scripted replay transcript, zero tokens,
  # no secrets, works on a judge's phone. Stage machine (anthropic, live
  # calendar writes) stays local — see docs/plan/commercial.md.
  #
  # Live 2026-10-15: Render Starter service `meridian`
  # (srv-db8cve1srm7s73e7eod0), frankfurt, autoDeploy on main.
  # Public URL: https://meridian-afud.onrender.com
  # NOTE: Render can't upgrade free→paid in place, so this Blueprint describes
  # the shape — the live service was created via API as `meridian` (Starter).
  # The old free `meridian-replay` service is suspended.
  - type: web
    name: meridian
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    # Render injects PORT; `next start` honours it automatically.
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: AGENT_PROVIDER
        value: replay
      - key: NEXT_PUBLIC_AGENT_PROVIDER
        value: replay
      - key: NODE_VERSION
        value: 22.12.0
