services:
  # Public demo surface: the free tier. Scripted replay transcript, zero tokens,
  # no secrets, works on a judge's phone. Stage machine (anthropic, live
  # calendar writes) stays local — see docs/plan/commercial.md.
  #
  # Live 2026-10-15: Render Starter service `meridian`
  # (srv-db8cve1srm7s73e7eod0), frankfurt, autoDeploy on main.
  # Public URL: https://meridian-afud.onrender.com
  # NOTE: Render can't upgrade free→paid in place, so this Blueprint describes
  # the shape — the live service was created via API as `meridian` (Starter).
  # The old free `meridian-replay` service is suspended.
  - type: web
    name: meridian
    runtime: node
    plan: starter
    region: frankfurt
    autoDeploy: true
    # Render injects PORT; `next start` honours it automatically.
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: AGENT_PROVIDER
        value: replay
      - key: NEXT_PUBLIC_AGENT_PROVIDER
        value: replay
      - key: NODE_VERSION
        value: 22.12.0
      # Graph memory (Graph Hacks): reach the private FalkorDB service below.
      # Local dev uses FALKORDB_URL in .env.local instead — unset locally and
      # graph memory no-ops to crew-memory.json.
      - key: FALKORDB_HOST
        fromService:
          name: meridian-falkordb
          type: pserv
          property: host
      - key: FALKORDB_PORT
        fromService:
          name: meridian-falkordb
          type: pserv
          property: port
      - key: MERIDIAN_SESSION
        value: run-2

  # FalkorDB graph memory — private service, internal TCP only (not public).
  # The web app reaches it as falkor://<host>:<port> via the env vars above.
  # This is the demo backend: judges hit the public URL, the crew reads the
  # graph inside Render's network.
  - type: pserv
    name: meridian-falkordb
    runtime: image
    image:
      url: docker.io/falkordb/falkordb:latest
    plan: starter
    region: frankfurt
    # FalkorDB serves RESP on 6379; the bundled browser UI on 3000 stays
    # private too (reachable only from inside Render).
    envVars: []
